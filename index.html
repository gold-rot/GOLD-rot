<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GOLD Risk">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>GOLD Risk Calculator</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7f9;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--ok:#065f46;--warn:#92400e}
@media(prefers-color-scheme:dark){:root{--bg:#0b0f14;--card:#151a21;--text:#f3f4f6;--muted:#9ca3af;--line:#2a313b;--ok:#6ee7b7;--warn:#fbbf24}}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
main{max-width:520px;margin:auto;padding:18px 16px 40px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
h1{font-size:22px;margin:0 0 4px}.sub,label,.k,.foot{color:var(--muted)}.sub{font-size:13px;margin-bottom:14px}
.side-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}.side-btn{min-height:48px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--text);font-size:16px;font-weight:700}.side-btn.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{font-size:12px}
input{width:100%;font-size:20px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--text);margin-top:6px}
.hero{text-align:center}.hero .v{font-size:56px;font-weight:800;line-height:1}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.stat{background:var(--bg);border-radius:14px;padding:12px}.stat .k{font-size:11px}.stat .v{font-size:18px;font-weight:700;margin-top:4px}
.note{font-size:13px;line-height:1.55;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:12px}.ok{color:var(--ok)}.warn{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px 4px;border-bottom:1px solid var(--line)}th{text-align:left;color:var(--muted)}
td:nth-child(2),td:nth-child(3),th:nth-child(2),th:nth-child(3){text-align:right}
button.reset{width:100%;min-height:46px;border:0;border-radius:12px;font-size:15px;font-weight:700;background:var(--text);color:var(--bg);margin-top:12px}.foot{font-size:11px;line-height:1.6}
</style>
</head>
<body>
<main>
<h1>GOLD リスク計算</h1>
<div class="sub">ロング／ショートを選び、損切り位置から適正ロットを逆算</div>

<section class="card">
<div class="side-switch">
<button id="longBtn" class="side-btn" type="button">ロング（買い）</button>
<button id="shortBtn" class="side-btn active" type="button">ショート（売り）</button>
</div>
<div class="grid">
<div class="full"><label>エントリー価格 (USD)<input id="entry" type="number" step="0.1" inputmode="decimal" value="4357"></label></div>
<div class="full"><label>損切り価格 (USD)<input id="stop" type="number" step="0.1" inputmode="decimal" value="4388"></label></div>
<div><label>USD/JPY<input id="fx" type="number" step="0.01" inputmode="decimal" value="160"></label></div>
<div><label>許容損失 (円)<input id="risk" type="number" step="1000" inputmode="numeric" value="10000"></label></div>
<div class="full"><label>1枚あたり契約倍率<input id="mult" type="number" step="0.01" inputmode="decimal" value="1"></label></div>
</div>
</section>

<section class="card">
<div class="hero"><div class="k">適正ロット上限</div><div class="v" id="lots">2</div><div>枚</div></div>
<div class="stats">
<div class="stat"><div class="k">損切り値幅</div><div class="v" id="distance">$31.0</div></div>
<div class="stat"><div class="k">1枚あたり損失</div><div class="v" id="perLot">4,960円</div></div>
<div class="stat"><div class="k">選択ロットの損失</div><div class="v" id="actual">9,920円</div></div>
<div class="stat"><div class="k">方向</div><div class="v" id="side">ショート</div></div>
</div>
<div class="note" id="message">チャートで決めた損切り位置は動かさず、ロット側で調整します。</div>
</section>

<section class="card">
<strong>1〜10枚の想定損失</strong>
<table><thead><tr><th>枚数</th><th>想定損失</th><th>判定</th></tr></thead><tbody id="rows"></tbody></table>
<button id="reset" class="reset" type="button">初期値に戻す</button>
</section>

<div class="foot">
計算式：許容損失 ÷（損切り値幅 × USD/JPY × 契約倍率）。<br>
ロングでは損切り価格はエントリーより下、ショートでは上にあることをチェックします。<br>
スプレッド、スリッページ、調整金は含みません。契約倍率は利用中の商品仕様を確認してください。
</div>
</main>

<script>
(()=>{
const q=id=>document.getElementById(id);
const fmt=new Intl.NumberFormat("ja-JP",{maximumFractionDigits:0});
let mode="short";

function setMode(next){
 mode=next;
 q("longBtn").classList.toggle("active",mode==="long");
 q("shortBtn").classList.toggle("active",mode==="short");
 render();
}
function val(id){const n=Number(q(id).value);return Number.isFinite(n)?n:0}

function render(){
 const entry=val("entry"),stop=val("stop"),fx=val("fx"),risk=val("risk"),mult=val("mult");
 const d=Math.abs(entry-stop);
 const directionValid=mode==="long" ? stop<entry : stop>entry;
 q("side").textContent=mode==="long"?"ロング":"ショート";

 if(entry<=0||stop<=0||fx<=0||risk<=0||mult<=0||d<=0){
  ["lots","distance","perLot","actual"].forEach(x=>q(x).textContent="—");
  q("rows").innerHTML="";
  q("message").textContent="0より大きい有効な数字を入力してください。";
  q("message").className="note warn";
  return;
 }

 q("distance").textContent="$"+d.toFixed(1);

 if(!directionValid){
  ["lots","perLot","actual"].forEach(x=>q(x).textContent="—");
  q("rows").innerHTML="";
  q("message").textContent=mode==="long"
   ?"ロングでは、損切り価格はエントリー価格より下に設定してください。"
   :"ショートでは、損切り価格はエントリー価格より上に設定してください。";
  q("message").className="note warn";
  return;
 }

 const per=d*fx*mult;
 const lots=Math.floor(risk/per);
 const actual=lots*per;

 q("lots").textContent=String(Math.max(0,lots));
 q("perLot").textContent=fmt.format(per)+"円";
 q("actual").textContent=fmt.format(actual)+"円";

 if(lots<1){
  q("message").textContent="1枚でも許容損失を超えます。損切り位置を無理に近づけず、見送りや資金配分を再検討してください。";
  q("message").className="note warn";
 }else{
  q("message").textContent=`最大 ${lots}枚。${lots+1}枚では約${fmt.format((lots+1)*per)}円となり、許容損失を超えます。`;
  q("message").className="note ok";
 }

 let rows="";
 for(let i=1;i<=10;i++){
  const loss=i*per,ok=loss<=risk;
  rows+=`<tr><td>${i}枚</td><td>${fmt.format(loss)}円</td><td class="${ok?"ok":"warn"}">${ok?"範囲内":"超過"}</td></tr>`;
 }
 q("rows").innerHTML=rows;
}

q("longBtn").addEventListener("click",()=>setMode("long"));
q("shortBtn").addEventListener("click",()=>setMode("short"));
["entry","stop","fx","risk","mult"].forEach(id=>q(id).addEventListener("input",render));
q("reset").addEventListener("click",()=>{
 mode="short";
 q("entry").value=4357;q("stop").value=4388;q("fx").value=160;q("risk").value=10000;q("mult").value=1;
 q("longBtn").classList.remove("active");q("shortBtn").classList.add("active");render();
});
if("serviceWorker"in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}))}
render();
})();
</script>
</body>
</html>
